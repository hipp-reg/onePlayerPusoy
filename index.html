<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Pusoy Way - Bots follow Pusoy rules</title>
<style>
  body{font-family:Arial,Helvetica,sans-serif;background:#0b6623;color:#fff;padding:18px}
  h1{text-align:center;margin-bottom:8px}
  .controls{text-align:center;margin-bottom:12px}
  .player{margin:18px 0;padding:12px;border-radius:8px;background:rgba(255,255,255,0.06)}
  .cards{display:flex;flex-wrap:wrap;gap:8px;min-height:72px;padding:10px;border-radius:6px;background:rgba(255,255,255,0.03)}
  .cards[data-limit]::before{font-size:12px;color:#ddd;display:block;margin-bottom:6px}
  .cards[data-limit="5"]::before{content:"5-card hand"}
  .cards[data-limit="3"]::before{content:"3-card hand"}
  .card{width:56px;height:78px;background:#fff;color:#000;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;cursor:grab;border:2px solid #333}
  .card.red{color:#c00}
  .card.locked{cursor:default;opacity:0.9}
  button{margin:6px;padding:8px 12px;border-radius:6px;border:none;cursor:pointer}
  .note{font-size:13px;color:#ddd;margin-top:6px}
</style>
</head>
<body>
<h1>Pusoy Way — You vs 3 Bots (Pusoy rules)</h1>

<div class="controls">
  <button id="startBtn">Start Game</button>
  <button id="lockBtn">Lock In</button>
  <button id="revealBtn">Reveal All</button>
</div>

<div id="players"></div>

<script>
/* ---------- Constants ---------- */
const suits=["♠","♥","♦","♣"];
const ranks=["A","K","Q","J","10","9","8","7","6","5","4","3","2"];
const rankValue={ "A":14,"K":13,"Q":12,"J":11,"10":10,"9":9,"8":8,"7":7,"6":6,"5":5,"4":4,"3":3,"2":2 };

/* ---------- State ---------- */
let playersHands=[];                 // dealt hands
let playerState = null;              // human player's state: { pool:[], back:[], middle:[], front:[] }
let botsArranged=[null,null,null];   // bots' arranged hands
let lockedIn=[false,false,false,false];
let revealed=false;
let draggingInfo = null;

/* ---------- Deck utilities ---------- */
function createDeck(){
  const deck=[];
  for(const s of suits) for(const r of ranks) deck.push(r+s);
  return deck;
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; }

/* ---------- Poker evaluation helpers ---------- */
function countRanks(cards){
  const cnt={}; for(const c of cards){ const r=c.replace(/[^A-Z0-9]/g,""); cnt[r]=(cnt[r]||0)+1 } return cnt;
}
function isFlush(cards){ const s=cards.map(c=>[...c].find(ch=>suits.includes(ch))); return s.every(x=>x===s[0]); }
function isStraight(cards){
  const vals=cards.map(c=>rankValue[c.replace(/[^A-Z0-9]/g,"")]).sort((a,b)=>a-b);
  let straight=true; for(let i=1;i<vals.length;i++) if(vals[i]!==vals[i-1]+1) straight=false;
  if(straight) return true;
  const wheel=[2,3,4,5,14]; return JSON.stringify(vals)===JSON.stringify(wheel);
}
function evaluate5(cards){
  const cnt=countRanks(cards);
  const counts=Object.values(cnt).sort((a,b)=>b-a);
  const flush=isFlush(cards), straight=isStraight(cards);
  const vals=cards.map(c=>rankValue[c.replace(/[^A-Z0-9]/g,"")]).sort((a,b)=>b-a);
  if(straight && flush) return [8, vals];
  if(counts[0]===4){
    const four=+Object.keys(cnt).find(k=>cnt[k]===4);
    const kicker=+Object.keys(cnt).find(k=>cnt[k]===1);
    return [7,[four,kicker]];
  }
  if(counts[0]===3 && counts[1]===2){
    const three=+Object.keys(cnt).find(k=>cnt[k]===3);
    const two=+Object.keys(cnt).find(k=>cnt[k]===2);
    return [6,[three,two]];
  }
  if(flush) return [5,vals];
  if(straight) return [4,vals];
  if(counts[0]===3){
    const three=+Object.keys(cnt).find(k=>cnt[k]===3);
    const kickers=Object.keys(cnt).filter(k=>cnt[k]===1).map(k=>rankValue[k]).sort((a,b)=>b-a);
    return [3,[three,...kickers]];
  }
  if(counts[0]===2 && counts[1]===2){
    const pairs=Object.keys(cnt).filter(k=>cnt[k]===2).map(k=>rankValue[k]).sort((a,b)=>b-a);
    const kicker=Object.keys(cnt).find(k=>cnt[k]===1);
    return [2,[...pairs,rankValue[kicker]]];
  }
  if(counts[0]===2){
    const pair=+Object.keys(cnt).find(k=>cnt[k]===2);
    const kickers=Object.keys(cnt).filter(k=>cnt[k]===1).map(k=>rankValue[k]).sort((a,b)=>b-a);
    return [1,[pair,...kickers]];
  }
  return [0,vals];
}
function evaluate3(cards){
  const cnt=countRanks(cards);
  const vals=cards.map(c=>rankValue[c.replace(/[^A-Z0-9]/g,"")]).sort((a,b)=>b-a);
  const counts=Object.values(cnt).sort((a,b)=>b-a);
  if(counts[0]===3) return [3,vals];
  if(counts[0]===2){
    const pair=+Object.keys(cnt).find(k=>cnt[k]===2);
    const kicker=+Object.keys(cnt).find(k=>cnt[k]===1);
    return [2,[pair,kicker]];
  }
  return [1,vals];
}
function compareEval(a,b){
  if(a[0]!==b[0]) return a[0]-b[0];
  const A=a[1], B=b[1];
  for(let i=0;i<Math.max(A.length,B.length);i++){
    const av=A[i]||0, bv=B[i]||0;
    if(av!==bv) return av-bv;
  }
  return 0;
}

/* ---------- Exhaustive arranger for bots ----------
   This enumerates all C(13,5)*C(8,5) = 72,072 splits and picks the best valid one.
*/
function autoArrangeBestExhaustive(hand){
  // convert hand to array of strings
  const n = hand.length; // 13
  const indices = [...Array(n).keys()];
  let best = null;
  let bestScore = -Infinity;

  // generate all combinations of 5 indices for back
  const comb5 = [];
  function combRecursive(start, k, acc){
    if(k===0){ comb5.push(acc.slice()); return; }
    for(let i=start;i<=n-k;i++){ acc.push(i); combRecursive(i+1,k-1,acc); acc.pop(); }
  }
  combRecursive(0,5,[]);

  // for each back, choose middle from remaining
  for(const backIdx of comb5){
    const remaining1 = indices.filter(i=>!backIdx.includes(i));
    // generate combinations of 5 from remaining1
    const m = remaining1.length; // 8
    // generate combinations of 5 indices (relative to remaining1)
    function combMidRecursive(start,k,acc){
      if(k===0){
        // build actual index lists
        const middleIdx = acc.map(x=>remaining1[x]);
        const frontIdx = remaining1.filter(i=>!middleIdx.includes(i));
        // build card arrays
        const back = backIdx.map(i=>hand[i]);
        const middle = middleIdx.map(i=>hand[i]);
        const front = frontIdx.map(i=>hand[i]);
        // evaluate and enforce ordering
        const eb = evaluate5(back), em = evaluate5(middle), ef = evaluate3(front);
        if(compareEval(eb,em) < 0) return; // invalid: back < middle
        // compute numeric score (higher better)
        const backScore = eb[0]*1e8 + (eb[1]||[]).reduce((s,v,i)=>s+v/(100**(i+1)),0);
        const midScore  = em[0]*1e5 + (em[1]||[]).reduce((s,v,i)=>s+v/(100**(i+1)),0);
        const frontScore= ef[0]*1e2 + (ef[1]||[]).reduce((s,v,i)=>s+v/(100**(i+1)),0);
        const score = backScore + midScore + frontScore;
        if(score > bestScore){ bestScore = score; best = { back: back.slice(), middle: middle.slice(), front: front.slice() }; }
        return;
      }
      for(let i=start;i<=m-k;i++){ acc.push(i); combMidRecursive(i+1,k-1,acc); acc.pop(); }
    }
    combMidRecursive(0,5,[]);
  }

  if(!best){
    // fallback simple split
    return { back: hand.slice(0,5), middle: hand.slice(5,10), front: hand.slice(10,13) };
  }
  return best;
}

/* ---------- UI and state management ---------- */
function dealCards(){
  const deck = shuffle(createDeck());
  playersHands=[[],[],[],[]];
  for(let i=0;i<52;i++) playersHands[i%4].push(deck[i]);
  playerState = { pool: playersHands[0].slice(), back: [], middle: [], front: [] };
  lockedIn=[false,false,false,false];
  revealed=false;
  // use exhaustive arranger for bots
  botsArranged = [
    autoArrangeBestExhaustive(playersHands[1]),
    autoArrangeBestExhaustive(playersHands[2]),
    autoArrangeBestExhaustive(playersHands[3])
  ];
  displayPlayers();
}

function displayPlayers(){
  const container=document.getElementById('players'); container.innerHTML='';
  playersHands.forEach((hand, idx)=>{
    const div=document.createElement('div'); div.className='player';
    div.innerHTML=`<h2>Player ${idx+1} ${idx===0?'(You)':''}</h2>`;
    if(idx===0){
      // human: render from playerState
      const pool=document.createElement('div'); pool.className='cards'; pool.dataset.limit='13'; pool.dataset.name='pool';
      playerState.pool.forEach(c=>pool.appendChild(createCard(c,'pool')));
      if(!lockedIn[0] && !revealed){
        pool.addEventListener('dragover', e=>e.preventDefault());
        pool.addEventListener('drop', e=>{ e.preventDefault(); if(!draggingInfo) return; moveCard(draggingInfo.from,'pool',draggingInfo.text); draggingInfo=null; });
      }
      div.appendChild(pool);

      const slotNames=['back','middle','front'];
      const limits=['5','5','3'];
      for(let i=0;i<3;i++){
        const slot=document.createElement('div'); slot.className='cards'; slot.dataset.limit=limits[i]; slot.dataset.name=slotNames[i];
        playerState[slotNames[i]].forEach(c=>slot.appendChild(createCard(c,slotNames[i])));
        if(!lockedIn[0] && !revealed){
          slot.addEventListener('dragover', e=>e.preventDefault());
          slot.addEventListener('drop', e=>{ e.preventDefault(); if(!draggingInfo) return; if(slot.children.length >= parseInt(slot.dataset.limit)){ draggingInfo=null; return; } moveCard(draggingInfo.from, slotNames[i], draggingInfo.text); draggingInfo=null; });
        }
        div.appendChild(slot);
      }

      const s1=document.createElement('button'); s1.textContent='Sort by Suit'; s1.disabled = lockedIn[0] || revealed;
      s1.onclick=()=>{ sortBySuitState('pool'); displayPlayers(); };
      const s2=document.createElement('button'); s2.textContent='Sort by Rank'; s2.disabled = lockedIn[0] || revealed;
      s2.onclick=()=>{ sortByRankState('pool'); displayPlayers(); };
      const resetBtn=document.createElement('button'); resetBtn.textContent='Reset My Hand'; resetBtn.disabled = lockedIn[0] || revealed;
      resetBtn.onclick=()=>{ resetPlayerHand(); displayPlayers(); };
      div.appendChild(s1); div.appendChild(s2); div.appendChild(resetBtn);

      const note=document.createElement('div'); note.className='note';
      note.textContent = lockedIn[0] ? (revealed ? 'Locked and revealed — cards are final.' : 'Locked — cards cannot be moved.') : 'Arrange your cards into back (5), middle (5), front (3).';
      div.appendChild(note);

    } else {
      if(revealed){
        const b=document.createElement('div'); b.className='cards'; b.dataset.limit='5';
        botsArranged[idx-1].back.forEach(c=>b.appendChild(makeCard(c))); div.appendChild(b);
        const m=document.createElement('div'); m.className='cards'; m.dataset.limit='5';
        botsArranged[idx-1].middle.forEach(c=>m.appendChild(makeCard(c))); div.appendChild(m);
        const f=document.createElement('div'); f.className='cards'; f.dataset.limit='3';
        botsArranged[idx-1].front.forEach(c=>f.appendChild(makeCard(c))); div.appendChild(f);
      } else {
        const hidden=document.createElement('div'); hidden.className='cards'; hidden.textContent='Cards hidden until reveal'; div.appendChild(hidden);
      }
    }
    container.appendChild(div);
  });

  // attach drag listeners to human cards
  document.querySelectorAll('.card[data-owner="pool"], .card[data-owner="back"], .card[data-owner="middle"], .card[data-owner="front"]').forEach(card=>{
    if(lockedIn[0] || revealed){
      card.draggable=false; card.classList.add('locked'); return;
    }
    card.draggable=true; card.classList.remove('locked');
    card.addEventListener('dragstart', e=>{
      const text = card.textContent;
      const parent = card.parentElement;
      const from = parent.dataset.name || 'pool';
      draggingInfo = { text, from };
      card.classList.add('dragging');
    });
    card.addEventListener('dragend', e=>{
      draggingInfo = null;
      card.classList.remove('dragging');
    });
  });
}

/* ---------- Move and sort helpers ---------- */
function moveCard(fromName, toName, cardText){
  if(!playerState) return;
  if(lockedIn[0] || revealed) return;
  const src = playerState[fromName];
  const idx = src.indexOf(cardText);
  if(idx !== -1) playerState[fromName].splice(idx,1);
  else {
    // fallback: remove from any array
    for(const k of ['pool','back','middle','front']){
      const i = playerState[k].indexOf(cardText);
      if(i!==-1){ playerState[k].splice(i,1); break; }
    }
  }
  playerState[toName].push(cardText);
  displayPlayers();
}
function sortBySuitState(name){
  const arr = playerState[name];
  arr.sort((a,b)=>{
    const sa=[...a].find(ch=>suits.includes(ch));
    const sb=[...b].find(ch=>suits.includes(ch));
    const order={'♠':1,'♥':2,'♦':3,'♣':4};
    if(order[sa] !== order[sb]) return order[sa]-order[sb];
    const ra=a.replace(/[^A-Z0-9]/g,''), rb=b.replace(/[^A-Z0-9]/g,'');
    return rankValue[rb]-rankValue[ra];
  });
}
function sortByRankState(name){
  const arr = playerState[name];
  arr.sort((a,b)=> rankValue[b.replace(/[^A-Z0-9]/g,'')] - rankValue[a.replace(/[^A-Z0-9]/g,'')] );
}
function resetPlayerHand(){
  const all = [...playerState.pool, ...playerState.back, ...playerState.middle, ...playerState.front];
  playerState.pool = all.slice();
  playerState.back = []; playerState.middle = []; playerState.front = [];
}

/* ---------- DOM card creation ---------- */
function createCard(text, owner){
  const el=document.createElement('div'); el.className='card'; el.textContent=text;
  if(text.includes('♥')||text.includes('♦')) el.classList.add('red'); else el.classList.add('black');
  el.dataset.owner = owner || 'pool';
  el.draggable = !lockedIn[0] && !revealed;
  return el;
}
function makeCard(text){
  const el=document.createElement('div'); el.className='card'; el.textContent=text;
  if(text.includes('♥')||text.includes('♦')) el.classList.add('red'); else el.classList.add('black');
  el.draggable=false;
  return el;
}

/* ---------- Validation and controls ---------- */
function checkValid(p){
  if(p!==0) return true;
  return playerState.back.length===5 && playerState.middle.length===5 && playerState.front.length===3;
}
function lockIn(){
  if(!checkValid(0)){ alert('You must place exactly 5-5-3 before locking in!'); return; }
  lockedIn[0]=true;
  displayPlayers();
  alert('You locked in!');
}
function revealAll(){
  if(!lockedIn[0]){ alert('Lock in first'); return; }
  revealed=true;
  displayPlayers();
}

/* ---------- Buttons wiring ---------- */
document.getElementById('startBtn').addEventListener('click', ()=>dealCards());
document.getElementById('lockBtn').addEventListener('click', ()=>lockIn());
document.getElementById('revealBtn').addEventListener('click', ()=>revealAll());

/* ---------- Initial deal ---------- */
dealCards();
</script>
</body>
</html>
